name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Run backend test suite
        working-directory: .
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # This repo uses bun (bun.lock is the committed lockfile, not
      # package-lock.json) -- installing with npm would resolve a
      # different dependency tree than what's actually developed/tested
      # against and Docker builds with.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # `tsc` alone fails on a fresh checkout: Next.js's route/layout
      # prop types (e.g. LayoutProps) are generated into .next/types by
      # the dev server or build, not committed to the repo. `next typegen`
      # produces just those types without a full production build.
      - name: Generate Next.js route types
        run: bunx next typegen

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Lint
        run: bunx eslint .

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t intelx-backend:ci .

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t intelx-frontend:ci .
